services:
  - type: web
    name: aetherglyph-server
    runtime: node
    plan: standard
    numInstances: 1
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: SESSION_SECRET
        generateValue: true
      - key: MAX_CONNECTIONS
        value: "600"
      - key: MAX_CONNECTIONS_PER_IP
        value: "50"
      - key: ALLOWED_ORIGINS
        value: "https://configmancooper.github.io"
      # Optional persistent quick-match ratings:
      # - key: DATABASE_URL
      #   fromDatabase:
      #     name: aetherglyph-ratings
      #     property: connectionString
